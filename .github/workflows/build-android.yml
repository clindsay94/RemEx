name: Build Android (Dev/Test)

on:
  push:
    branches: [main]
    paths:
      - 'RemEx.Android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'RemEx.Android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RemEx.Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('RemEx.Android/**/*.gradle.kts', 'RemEx.Android/gradle/libs.versions.toml') }}

      - name: Build debug APK (Android-only, no .NET native lib)
        run: ./gradlew assembleDebug -x syncRemexCoreDebugSo -x mergeDebugNativeLibs
        # Note: This CI build skips the Remex.Core native library sync.
        # The .NET NativeAOT cross-compilation requires a full .NET + Android NDK
        # setup that is not configured in this workflow. This build verifies
        # Kotlin/Compose compilation only.

      - name: Run unit tests
        run: ./gradlew test
