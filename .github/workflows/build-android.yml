name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Debug Keystore
      run: |
        keytool -genkey -v -keystore ${{ github.workspace }}/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Publish Android App
      run: >
        dotnet publish Remex.Client.Android/Remex.Client.Android.csproj
        -c Release
        -f net10.0-android
        -p:AndroidPackageFormat=apk
        -p:AndroidKeyStore=true
        -p:AndroidSigningKeyStore=${{ github.workspace }}/debug.keystore
        -p:AndroidSigningKeyAlias=androiddebugkey
        -p:AndroidSigningKeyPass=android
        -p:AndroidSigningStorePass=android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Remex-Android-APK
        path: |
          **/*-Signed.apk
