lifecycleViewmodelCompose = "2.6.1"
materialIconsExtended = "1.7.5"
androidxGraphicsPath = "1.0.1"
navigationCompose = "2.8.1"
androidxDatastorePreferences = "1.1.1"

[libraries]
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.9.7" }
