[versions]
agp = "9.2.0"
glance = "1.1.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
activityCompose = "1.13.0"
kotlin = "2.3.21"
lifecycleVersion = "2.10.0"
# Stable material 1.13 supports color.utilities APIs (Variant.FRUIT_SALAD, Variant.RAINBOW) used in DynamicSchemes.kt
material = "1.13.0"
androidxComposeUiTextGoogleFonts = "1.11.0"
materialIconsExtended = "1.7.5"
androidxGraphicsPath = "1.0.1"
androidxGraphicsShapes = "1.1.0"
navigationCompose = "2.9.8"
androidxDatastorePreferences = "1.1.1"
mlkitBarcode = "17.3.0"
camerax = "1.6.0"
tink = "1.15.0"

[libraries]
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.9.8" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.2.1" }
