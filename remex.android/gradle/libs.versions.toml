[versions]
agp = "9.2.1"
junit = "4.13.2"
activityCompose = "1.13.0"
kotlin = "2.3.21"
# Stable material 1.14 supports color.utilities APIs (Variant.FRUIT_SALAD, Variant.RAINBOW) used in DynamicSchemes.kt
material = "1.14.0"
androidxComposeUiTextGoogleFonts = "1.11.0"
mlkitBarcode = "17.3.0"
camerax = "1.6.1"
tink = "1.21.0"
okhttp = "4.12.0"

[libraries]
tink-android = { module = "com.google.crypto.tink:tink-android", version = "1.22.0" }
# OkHttp powers the plain-Kotlin binary /ws/files WebSocket channel (SPKI-pinned). No JNI involved.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version = "2.10.0-alpha06" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.3.0-alpha09" }
androidx-graphics-path = { group = "androidx.graphics", name = "graphics-path", version = "1.1.0" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version = "1.1.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.0" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.7.0" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.11.0" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.11.0" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.11.0" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version = "1.12.0-beta02" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version = "1.12.0-beta02" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version = "1.12.0-beta02" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version = "1.12.0-beta02" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version = "1.12.0-beta02" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version = "1.12.0-beta02" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version = "1.5.0-alpha23" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version = "1.5.0-alpha23" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version = "1.3.0-rc01" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version = "1.3.0-rc01" }
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version = "1.3.0-rc01" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version = "1.2.0-rc01" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version = "1.2.0-rc01" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version = "1.12.0-beta02" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.2.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
